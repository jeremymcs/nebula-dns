global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Nebula DNS API
  - job_name: 'nebuladns-api'
    static_configs:
      - targets: ['api:4000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Nebula DNS Policy Service
  - job_name: 'nebuladns-policy-svc'
    static_configs:
      - targets: ['policy-svc:8080']
    metrics_path: /metrics
    scrape_interval: 5s

  # dnsdist
  - job_name: 'dnsdist'
    static_configs:
      - targets: ['dnsdist:8083']
    metrics_path: /metrics
    scrape_interval: 5s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ClickHouse
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
    metrics_path: /metrics

  # Node Exporter for host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

