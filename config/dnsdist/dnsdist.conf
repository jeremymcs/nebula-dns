-- SafeDNS dnsdist Configuration
-- This is a simplified development configuration

-- ============================================
-- BACKEND POOLS
-- ============================================

-- Unbound recursive resolver pool
newServer({
    address = "unbound:53",
    pool = "unbound",
    checkName = "google.com",
    checkInterval = 10,
    maxCheckFailures = 3,
    retries = 2
})

-- Set default policy
setPoolServerPolicy(roundrobin, "unbound")

-- ============================================
-- LISTENERS (Development Mode)
-- ============================================

-- Local DNS for development (non-TLS)
addLocal("0.0.0.0:53")

-- Web server for metrics (development only)
webserver("0.0.0.0:8083", "admin", "changeme")

-- Note: For production, add TLS listeners:
