-- ============================================
-- LUA HTTP CLIENT SETUP
-- ============================================

local http = nil
local json = nil

-- Try to load modules (may not be available in all environments)
pcall(function()
    http = require("socket.http")
    ltn12 = require("ltn12")
end)

pcall(function()
    json = require("cjson")
end)

-- Fallback JSON encoder if cjson not available
if not json then
    json = {
        encode = function(t)
            local result = "{"
            local first = true
            for k, v in pairs(t) do
                if not first then result = result .. "," end
                result = result .. '"' .. tostring(k) .. '":"' .. tostring(v) .. '"'
                first = false
            end
            return result .. "}"
        end,
        decode = function(s)
            -- Simple parser for our specific responses
            local result = {}
            for k, v in s:gmatch('"([^"]+)":"?([^",}]+)"?') do
                result[k] = v
            end
            return result
        end
    }
end

-- ============================================
-- TOKEN CACHE
-- ============================================

local tokenCache = {}
local tokenCacheTTL = 300 -- 5 minutes

function validateToken(token)
    -- Check cache first
    local cached = tokenCache[token]
    if cached and cached.expires > os.time() then
        return cached.result
    end

    -- In development, accept any token and extract tenant/location from it
    -- Format: {location_id_base64}.{timestamp}.{random}.{signature}
    if token and #token > 0 then
        -- Parse the token (simplified for development)
        local parts = {}
        for part in string.gmatch(token, "[^.]+") do
            table.insert(parts, part)
        end

        if #parts >= 1 then
            -- Try to decode the location ID
            local result = {
                valid = true,
                tenant_id = "dev-tenant",
                location_id = "dev-location",
                rate_limit = 1000
            }

            -- Cache the result
            tokenCache[token] = {
                result = result,
                expires = os.time() + tokenCacheTTL
            }

            return result
        end
    end

    return { valid = false }
end

-- ============================================
-- POLICY EVALUATION (Simplified for Dev)
-- ============================================

function evaluatePolicy(dq, tenant_id, location_id)
    local qname = dq:getQName():toString()
    local qtype = dq:getQType()

    -- In production, this would call the Policy Service
    -- For development, implement simple rules

    -- Block known bad domains (example)
    local blocked_domains = {
        ["malware-test.example.com"] = "malware",
        ["phishing-test.example.com"] = "phishing",
        ["block-test.example.com"] = "blocklist"
    }

    local block_reason = blocked_domains[qname]
    if block_reason then
        return {
            decision = "BLOCK",
            reason = block_reason,
            block_type = "NXDOMAIN"
        }
    end

    -- SafeSearch rewrite (example)
    local safesearch_rewrites = {
        ["www.google.com"] = "forcesafesearch.google.com",
        ["www.youtube.com"] = "restrict.youtube.com"
    }

    local rewrite_target = safesearch_rewrites[qname]
    if rewrite_target then
        return {
            decision = "REWRITE",
            reason = "safesearch",
            rewrite_type = "CNAME",
            target = rewrite_target
        }
    end

    -- Default: allow
    return {
        decision = "ALLOW",
        reason = "default"
    }
end

-- ============================================
-- MAIN QUERY HANDLING
-- ============================================

addAction(AllRule(), LuaAction(function(dq)
    -- For development, use a default tenant/location
    local tenant_id = "dev-tenant"
    local location_id = "dev-location"

    -- Try to extract token from HTTP header (DoH)
    local auth = dq:getHTTPHeader("Authorization")
    if auth then
        local token = string.match(auth, "^Bearer%s+(.+)$")
        if token then
            local result = validateToken(token)
            if result.valid then
                tenant_id = result.tenant_id
                location_id = result.location_id
            end
        end
    end

    -- Evaluate policy
    local decision = evaluatePolicy(dq, tenant_id, location_id)

    -- Store tags for logging
    dq:setTag("tenant_id", tenant_id)
    dq:setTag("location_id", location_id)
    dq:setTag("decision", decision.decision)
    dq:setTag("reason", decision.reason)

    if decision.decision == "BLOCK" then
        -- Return NXDOMAIN or null route
        if decision.block_type == "null" then
            local qtype = dq:getQType()
            if qtype == DNSQType.A then
                return DNSAction.Spoof, newCA("0.0.0.0")
            elseif qtype == DNSQType.AAAA then
                return DNSAction.Spoof, newCA("::")
            end
        end
        dq:setRcode(DNSRCode.NXDOMAIN)
        return DNSAction.Spoof

    elseif decision.decision == "REWRITE" then
        -- Note: CNAME spoofing requires additional setup
        -- For now, just log the rewrite intention
        infolog("Would rewrite " .. dq:getQName():toString() .. " to " .. (decision.target or ""))
        return DNSAction.Pool, "unbound"
    end

    -- ALLOW: forward to Unbound
    return DNSAction.Pool, "unbound"
end))

-- ============================================
-- RESPONSE LOGGING
-- ============================================

addResponseAction(AllRule(), LuaResponseAction(function(dr)
    local tenant_id = dr:getTag("tenant_id") or ""
    local location_id = dr:getTag("location_id") or ""
    local decision = dr:getTag("decision") or "allow"
    local reason = dr:getTag("reason") or "default"

    infolog(string.format(
        "Query: qname=%s qtype=%s decision=%s reason=%s tenant=%s location=%s rcode=%s",
        dr:getQName():toString(),
        dr:getQType(),
        decision,
        reason,
        tenant_id,
        location_id,
        dr:getRcode()
    ))

    return DNSResponseAction.None
end))

-- ============================================
-- CACHE
-- ============================================

-- Response cache
pc = newPacketCache(10000, {
    maxTTL = 300,
    minTTL = 30,
    temporaryFailureTTL = 10,
    staleTTL = 60
})
getPool("unbound"):setCache(pc)

