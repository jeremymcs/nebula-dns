-- ============================================
-- BACKEND POOLS
-- ============================================

-- Resolve unbound hostname using system resolver
-- Docker's internal DNS will resolve 'unbound' to the container IP
local function resolveHost(hostname)
    local handle = io.popen("getent hosts " .. hostname .. " | awk '{print $1}'")
    if handle then
        local result = handle:read("*a")
        handle:close()
        result = result:gsub("%s+", "")
        if result and #result > 0 then
            return result
        end
    end
    return nil
end

local unbound_ip = resolveHost("unbound") or "172.19.0.3"
infolog("Resolved unbound to: " .. unbound_ip)

-- Unbound recursive resolver pool
newServer({
    address = unbound_ip,
    name = "unbound",
    pool = "unbound",
    checkName = "google.com",
    checkInterval = 10,
    maxCheckFailures = 3,
    retries = 2
})

-- Set default policy
setPoolServerPolicy(roundrobin, "unbound")

-- ============================================
-- ACCESS CONTROL
-- ============================================

-- Allow all private networks and localhost for development
setACL({"0.0.0.0/0", "::/0"})

-- ============================================
-- LISTENERS
-- ============================================

-- Local DNS for development (non-TLS)
addLocal("0.0.0.0:53")

-- Console control socket (explicit to prevent dnsdist using binary name as address)
controlSocket("127.0.0.1:5199")
setConsoleACL({"127.0.0.1/8", "::1/128"})

-- Web server for metrics
webserver("0.0.0.0:8083")

-- DNS-over-TLS (DoT) on port 853
addTLSLocal("0.0.0.0:853", "/etc/dnsdist/certs/server.crt", "/etc/dnsdist/certs/server.key", {
    minTLSVersion = "tls1.2"
})

-- DNS-over-HTTPS (DoH) on port 443
addDOHLocal("0.0.0.0:443", "/etc/dnsdist/certs/server.crt", "/etc/dnsdist/certs/server.key", "/dns-query", {
    minTLSVersion = "tls1.2"
})

-- ============================================
-- POLICY SERVICE CONFIGURATION
-- ============================================

-- Policy service URL (internal Docker network)
local POLICY_SVC_URL = "http://policy-svc:8080"

-- ============================================
-- LUA HTTP CLIENT SETUP
-- ============================================

local http = nil
local ltn12 = nil
local json = nil

-- Try to load modules
pcall(function()
    http = require("socket.http")
    ltn12 = require("ltn12")
end)

pcall(function()
    json = require("cjson")
end)

-- Fallback JSON encoder/decoder if cjson not available
if not json then
    json = {
        encode = function(t)
            local result = "{"
            local first = true
            for k, v in pairs(t) do
                if not first then result = result .. "," end
                if type(v) == "number" then
                    result = result .. '"' .. tostring(k) .. '":' .. tostring(v)
                elseif type(v) == "boolean" then
                    result = result .. '"' .. tostring(k) .. '":' .. (v and "true" or "false")
                else
                    result = result .. '"' .. tostring(k) .. '":"' .. tostring(v) .. '"'
                end
                first = false
            end
            return result .. "}"
        end,
        decode = function(s)
            local result = {}
            -- Parse string values
            for k, v in s:gmatch('"([^"]+)"%s*:%s*"([^"]*)"') do
                result[k] = v
            end
            -- Parse numeric values
            for k, v in s:gmatch('"([^"]+)"%s*:%s*(%d+)') do
                result[k] = tonumber(v)
            end
            -- Parse boolean values
            for k, v in s:gmatch('"([^"]+)"%s*:%s*(true)') do
                result[k] = true
            end
            for k, v in s:gmatch('"([^"]+)"%s*:%s*(false)') do
                result[k] = false
            end
            return result
        end
    }
end

-- HTTP POST helper function
function httpPost(url, body)
    if not http then
        return nil, "HTTP library not available"
    end

    local response_body = {}
    local res, code, headers = http.request{
        url = url,
        method = "POST",
        headers = {
            ["Content-Type"] = "application/json",
            ["Content-Length"] = #body
        },
        source = ltn12.source.string(body),
        sink = ltn12.sink.table(response_body)
    }

    if code == 200 or code == 202 then
        return table.concat(response_body), nil
    end

    return nil, "HTTP error: " .. tostring(code)
end

-- ============================================
-- TOKEN CACHE
-- ============================================

local tokenCache = {}
local tokenCacheTTL = 300 -- 5 minutes

function validateToken(token)
    -- Check cache first
    local cached = tokenCache[token]
    if cached and cached.expires > os.time() then
        return cached.result
    end

    -- Call policy-svc to validate token
    local body = json.encode({ token = token })
    local response, err = httpPost(POLICY_SVC_URL .. "/auth/validate", body)

    if response then
        local result = json.decode(response)
        if result.valid then
            -- Cache the result
            tokenCache[token] = {
                result = result,
                expires = os.time() + tokenCacheTTL
            }
            return result
        end
    else
        warnlog("Token validation failed: " .. (err or "unknown error"))
    end

    -- Fallback for development: accept any token
    if token and #token > 0 then
        local result = {
            valid = true,
            tenant_id = "dev-tenant",
            location_id = "dev-location",
            rate_limit = 1000
        }
        tokenCache[token] = {
            result = result,
            expires = os.time() + tokenCacheTTL
        }
        return result
    end

    return { valid = false }
end

-- ============================================
-- IP-BASED LOCATION LOOKUP
-- ============================================

local ipCache = {}
local ipCacheTTL = 300 -- 5 minutes

function lookupLocationByIP(client_ip)
    -- Check cache first
    local cached = ipCache[client_ip]
    if cached and cached.expires > os.time() then
        return cached.result
    end

    -- Call policy-svc to lookup location by IP
    local body = json.encode({ client_ip = client_ip })
    local response, err = httpPost(POLICY_SVC_URL .. "/auth/lookup-ip", body)

    if response then
        local result = json.decode(response)
        if result.found then
            -- Cache the result
            ipCache[client_ip] = {
                result = result,
                expires = os.time() + ipCacheTTL
            }
            return result
        end
    else
        warnlog("IP lookup failed: " .. (err or "unknown error"))
    end

    return { found = false }
end

-- ============================================
-- POLICY CACHE
-- ============================================

local policyCache = {}
local policyCacheTTL = 60 -- 1 minute

-- ============================================
-- POLICY EVALUATION
-- ============================================

function evaluatePolicy(dq, tenant_id, location_id)
    -- Get query name (use qname property for dnsdist 1.9.x)
    local qname = ""
    pcall(function()
        qname = tostring(dq.qname)
    end)

    -- Get query type
    local qtype = 1  -- Default to A record
    pcall(function()
        qtype = dq.qtype
    end)

    -- Get client IP
    local client_ip = "unknown"
    pcall(function()
        client_ip = tostring(dq.remoteaddr)
    end)

    -- Build request body
    local request = {
        tenant_id = tenant_id,
        location_id = location_id,
        qname = qname,
        qtype = qtype,
        client_ip = client_ip,
        timestamp = os.date("!%Y-%m-%dT%H:%M:%SZ")
    }

    -- Call policy-svc
    local body = json.encode(request)
    local response, err = httpPost(POLICY_SVC_URL .. "/evaluate", body)

    if response then
        local result = json.decode(response)
        return {
            decision = result.decision or "ALLOW",
            reason = result.reason or "default",
            category = result.category,
            block_type = result.block_type,
            rewrite_type = result.rewrite_type,
            target = result.rewrite_target,
            ttl = result.ttl or 0
        }
    else
        warnlog("Policy evaluation failed: " .. (err or "unknown error"))
    end

    -- Fail-open: allow on error
    return {
        decision = "ALLOW",
        reason = "policy_error"
    }
end

-- ============================================
-- MAIN QUERY HANDLING
-- ============================================

addAction(AllRule(), LuaAction(function(dq)
    -- Record start time for latency calculation
    local start_time = os.clock() * 1000

    -- Initialize tenant/location (will be set by token or IP lookup)
    local tenant_id = nil
    local location_id = nil
    local auth_method = "none"

    -- Get client IP (use remoteaddr for dnsdist 1.8.x)
    local client_ip = "unknown"
    pcall(function()
        client_ip = tostring(dq.remoteaddr)
    end)

    -- STEP 1: Try to extract token from HTTP header (DoH)
    local auth = nil
    pcall(function()
        auth = dq:getHTTPHeader("Authorization")
    end)

    if auth then
        local token = string.match(auth, "^Bearer%s+(.+)$")
        if token then
            local result = validateToken(token)
            if result.valid then
                tenant_id = result.tenant_id
                location_id = result.location_id
                auth_method = "token"
            end
        end
    end

    -- STEP 2: Fallback to IP-based location lookup if no valid token
    if not tenant_id or not location_id then
        if client_ip and client_ip ~= "unknown" then
            local ip_result = lookupLocationByIP(client_ip)
            if ip_result.found then
                tenant_id = ip_result.tenant_id
                location_id = ip_result.location_id
                auth_method = "ip"
                infolog("Location identified by IP: " .. client_ip .. " -> " .. location_id)
            end
        end
    end

    -- STEP 3: If still no location, use development defaults or reject
    if not tenant_id or not location_id then
        -- In production, you might want to reject unidentified queries
        -- For now, use development defaults
        tenant_id = "dev-tenant"
        location_id = "dev-location"
        auth_method = "default"
    end

    -- Evaluate policy
    local decision = evaluatePolicy(dq, tenant_id, location_id)

    -- Store tags for logging
    dq:setTag("tenant_id", tenant_id)
    dq:setTag("location_id", location_id)
    dq:setTag("client_ip", client_ip)
    dq:setTag("auth_method", auth_method)
    dq:setTag("decision", decision.decision)
    dq:setTag("reason", decision.reason)
    dq:setTag("category", decision.category or "")
    dq:setTag("start_time", tostring(start_time))

    if decision.decision == "BLOCK" then
        local qtype = dq:getQType()

        -- Block page redirect: return IP of block page server
        if decision.block_type == "blockpage" then
            -- Block page server IP (configured via environment or hardcoded)
            local blockpage_ip = os.getenv("BLOCKPAGE_IP") or "127.0.0.1"
            if qtype == DNSQType.A then
                return DNSAction.Spoof, newCA(blockpage_ip)
            elseif qtype == DNSQType.AAAA then
                -- Return empty for AAAA to force IPv4
                return DNSAction.Spoof, newCA("::")
            end
        -- Null route: return 0.0.0.0
        elseif decision.block_type == "null" then
            if qtype == DNSQType.A then
                return DNSAction.Spoof, newCA("0.0.0.0")
            elseif qtype == DNSQType.AAAA then
                return DNSAction.Spoof, newCA("::")
            end
        end
        -- Default: NXDOMAIN
        dq:setRcode(DNSRCode.NXDOMAIN)
        return DNSAction.Spoof

    elseif decision.decision == "REWRITE" and decision.target then
        -- CNAME rewrite for SafeSearch
        if decision.rewrite_type == "CNAME" then
            return DNSAction.Spoof, newCNAME(decision.target)
        end
        return DNSAction.Pool, "unbound"
    end

    -- ALLOW: forward to Unbound
    return DNSAction.Pool, "unbound"
end))

-- ============================================
-- RESPONSE LOGGING (Send to policy-svc for ClickHouse)
-- ============================================

addResponseAction(AllRule(), LuaResponseAction(function(dr)
    local tenant_id = dr:getTag("tenant_id") or ""
    local location_id = dr:getTag("location_id") or ""
    local decision = dr:getTag("decision") or "ALLOW"
    local reason = dr:getTag("reason") or "default"
    local category = dr:getTag("category") or ""
    local client_ip = dr:getTag("client_ip") or ""
    local start_time = tonumber(dr:getTag("start_time")) or 0
    local latency_ms = (os.clock() * 1000) - start_time

    -- Get query name and type safely
    local qname = ""
    local qtype = 1
    local rcode = 0
    pcall(function()
        qname = tostring(dr.qname)
        qtype = dr.qtype
        rcode = dr.rcode
    end)

    -- Log locally
    infolog(string.format(
        "Query: qname=%s qtype=%s decision=%s reason=%s tenant=%s location=%s rcode=%s",
        qname,
        qtype,
        decision,
        reason,
        tenant_id,
        location_id,
        rcode
    ))

    -- Send to policy-svc for ClickHouse logging (fire-and-forget)
    local logEntry = {
        tenant_id = tenant_id,
        location_id = location_id,
        client_ip = client_ip,
        qname = qname,
        qtype = qtype,
        action = decision,
        reason = reason,
        category = category,
        rcode = rcode,
        latency_ms = latency_ms,
        cached = false
    }

    -- Async log (don't wait for response)
    pcall(function()
        httpPost(POLICY_SVC_URL .. "/log", json.encode(logEntry))
    end)

    return DNSResponseAction.None
end))

