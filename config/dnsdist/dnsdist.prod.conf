-- ============================================
-- BACKEND POOLS
-- ============================================

-- Unbound recursive resolver pool
newServer({
    address = "unbound.nebula-dns.svc.cluster.local:53",
    name = "unbound",
    pool = "unbound",
    checkName = "google.com",
    checkInterval = 10,
    maxCheckFailures = 3,
    retries = 2,
    healthCheckMode = "lazy"
})

-- Set default policy
setPoolServerPolicy(roundrobin, "unbound")

-- ============================================
-- LISTENERS (Production Mode)
-- ============================================

-- DNS-over-TLS (DoT) on port 853
addTLSLocal("0.0.0.0:853", 
    "/etc/dnsdist/certs/server.crt", 
    "/etc/dnsdist/certs/server.key",
    {
        minTLSVersion = "tls1.2",
        ciphers = "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    }
)

-- DNS-over-HTTPS (DoH) on port 443
addDOHLocal("0.0.0.0:443",
    "/etc/dnsdist/certs/server.crt",
    "/etc/dnsdist/certs/server.key",
    "/dns-query",
    {
        minTLSVersion = "tls1.2",
        ciphers = "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    }
)

-- Console control socket (explicit to prevent dnsdist using binary name as address)
controlSocket("127.0.0.1:5199")
setConsoleACL({"127.0.0.1/8", "::1/128"})

-- Web server for metrics (bind to all interfaces for Prometheus scraping)
webserver("0.0.0.0:8083")
setWebserverConfig({
    apiKey = os.getenv("DNSDIST_API_KEY") or error("DNSDIST_API_KEY environment variable must be set")
})

-- ============================================
-- HTTP CLIENT FOR POLICY SERVICE
-- ============================================

local http = require("socket.http")
local ltn12 = require("ltn12")
local json = require("cjson")

local POLICY_SVC_URL = os.getenv("POLICY_SVC_URL") or "http://policy-svc.nebula-dns.svc.cluster.local:80"
local REQUEST_TIMEOUT = 0.05 -- 50ms timeout

-- ============================================
-- TOKEN CACHE
-- ============================================

local tokenCache = {}
local tokenCacheTTL = 300 -- 5 minutes
local tokenCacheMaxSize = 10000

local function cleanupTokenCache()
    local now = os.time()
    local count = 0
    for token, cached in pairs(tokenCache) do
        if cached.expires < now then
            tokenCache[token] = nil
        else
            count = count + 1
        end
    end
    return count
end

local function validateToken(token)
    if not token or #token == 0 then
        return { valid = false }
    end

    -- Check cache first
    local cached = tokenCache[token]
    if cached and cached.expires > os.time() then
        return cached.result
    end

    -- Call policy service
    local response_body = {}
    local request_body = json.encode({ token = token })
    
    local res, code = http.request({
        url = POLICY_SVC_URL .. "/auth/validate",
        method = "POST",
        headers = {
            ["Content-Type"] = "application/json",
            ["Content-Length"] = #request_body
        },
        source = ltn12.source.string(request_body),
        sink = ltn12.sink.table(response_body),
        timeout = REQUEST_TIMEOUT
    })

    if code == 200 and #response_body > 0 then
        local success, result = pcall(json.decode, table.concat(response_body))
        if success and result.valid then
            -- Cache the result
            if #tokenCache > tokenCacheMaxSize then
                cleanupTokenCache()
            end
            tokenCache[token] = {
                result = result,
                expires = os.time() + tokenCacheTTL
            }
            return result
        end
    end

    return { valid = false }
end

-- ============================================
-- POLICY CACHE
-- ============================================

local policyCache = {}
local policyCacheTTL = 60 -- 1 minute

local function evaluatePolicy(tenantId, locationId, qname, qtype)
    local cacheKey = locationId
    local cached = policyCache[cacheKey]
    
    -- Use cached policy if valid
    local policy = nil
    if cached and cached.expires > os.time() then
        policy = cached.policy
    end

    -- Call policy service for evaluation
    local response_body = {}
    local request_body = json.encode({
        tenant_id = tenantId,
        location_id = locationId,
        qname = qname,
        qtype = qtype
    })
    
    local res, code = http.request({
        url = POLICY_SVC_URL .. "/evaluate",
        method = "POST",
        headers = {
            ["Content-Type"] = "application/json",
            ["Content-Length"] = #request_body
        },
        source = ltn12.source.string(request_body),
        sink = ltn12.sink.table(response_body),
        timeout = REQUEST_TIMEOUT
    })

    if code == 200 and #response_body > 0 then
        local success, result = pcall(json.decode, table.concat(response_body))
        if success then
            return result
        end
    end

    -- Fail-open: allow query if policy service is unavailable
    return {
        decision = "ALLOW",
        reason = "policy_error",
        ttl = 30
    }
end

-- ============================================
-- ASYNC QUERY LOGGING
-- ============================================

local logQueue = {}
local maxLogQueueSize = 1000

local function queueLogEntry(entry)
    if #logQueue >= maxLogQueueSize then
        -- Drop oldest entries if queue is full
        table.remove(logQueue, 1)
    end
    table.insert(logQueue, entry)
end

local function flushLogs()
    if #logQueue == 0 then
        return
    end

    local entries = logQueue
    logQueue = {}

    local request_body = json.encode({ entries = entries })
    
    -- Fire and forget - don't wait for response
    pcall(function()
        http.request({
            url = POLICY_SVC_URL .. "/log",
            method = "POST",
            headers = {
                ["Content-Type"] = "application/json",
                ["Content-Length"] = #request_body
            },
            source = ltn12.source.string(request_body),
            sink = ltn12.sink.null(),
            timeout = 0.1
        })
    end)
end

-- Flush logs every second
addAction(AllRule(), LuaAction(function(dq)
    -- Periodic flush check (roughly every 100 queries)
    if math.random(100) == 1 then
        pcall(flushLogs)
    end
    return DNSAction.None
end))

-- ============================================
-- MAIN QUERY HANDLING
-- ============================================

addAction(AllRule(), LuaAction(function(dq)
    local startTime = os.clock()
    local tenantId = "unknown"
    local locationId = "unknown"
    local decision = nil

    -- Extract token from HTTP header (DoH) or use client IP for DoT
    local auth = dq:getHTTPHeader("Authorization")
    if auth then
        local token = string.match(auth, "^Bearer%s+(.+)$")
        if token then
            local result = validateToken(token)
            if result.valid then
                tenantId = result.tenant_id
                locationId = result.location_id
            else
                -- Invalid token - refuse query
                dq:setRcode(DNSRCode.REFUSED)
                return DNSAction.Spoof
            end
        end
    end

    -- Get query details
    local qname = dq:getQName():toString()
    local qtype = dq:getQType()

    -- Evaluate policy
    decision = evaluatePolicy(tenantId, locationId, qname, qtype)

    -- Store tags for logging
    dq:setTag("tenant_id", tenantId)
    dq:setTag("location_id", locationId)
    dq:setTag("decision", decision.decision)
    dq:setTag("reason", decision.reason or "")
    dq:setTag("category", decision.category or "")

    if decision.decision == "BLOCK" then
        -- Return block response
        local blockType = decision.block_type or "NXDOMAIN"
        
        if blockType == "null" or blockType == "0.0.0.0" then
            if qtype == DNSQType.A then
                return DNSAction.Spoof, newCA("0.0.0.0")
            elseif qtype == DNSQType.AAAA then
                return DNSAction.Spoof, newCA("::")
            end
        elseif blockType == "REFUSED" then
            dq:setRcode(DNSRCode.REFUSED)
            return DNSAction.Spoof
        end
        
        -- Default: NXDOMAIN
        dq:setRcode(DNSRCode.NXDOMAIN)
        return DNSAction.Spoof

    elseif decision.decision == "REWRITE" then
        -- Handle SafeSearch and other rewrites
        if decision.rewrite_type == "CNAME" and decision.target then
            -- Set CNAME answer
            local answers = {}
            answers[1] = {
                qtype = DNSQType.CNAME,
                content = decision.target,
                ttl = decision.ttl or 300
            }
            dq:setRecords(answers)
            return DNSAction.Spoof
        end
    end

    -- Store start time for latency tracking
    dq:setTag("start_time", tostring(startTime))

    -- ALLOW: forward to Unbound
    return DNSAction.Pool, "unbound"
end))

-- ============================================
-- RESPONSE LOGGING
-- ============================================

addResponseAction(AllRule(), LuaResponseAction(function(dr)
    local tenantId = dr:getTag("tenant_id") or "unknown"
    local locationId = dr:getTag("location_id") or "unknown"
    local decision = dr:getTag("decision") or "ALLOW"
    local reason = dr:getTag("reason") or ""
    local category = dr:getTag("category") or ""
    local startTimeStr = dr:getTag("start_time")

    local latencyMs = 0
    if startTimeStr then
        latencyMs = math.floor((os.clock() - tonumber(startTimeStr)) * 1000)
    end

    -- Queue log entry for async processing
    queueLogEntry({
        timestamp = os.date("!%Y-%m-%dT%H:%M:%SZ"),
        tenant_id = tenantId,
        location_id = locationId,
        qname = dr:getQName():toString(),
        qtype = dr:getQType(),
        rcode = dr:getRcode(),
        decision = decision,
        reason = reason,
        category = category,
        latency_ms = latencyMs,
        client_ip = dr:getRemote():toString()
    })

    return DNSResponseAction.None
end))

-- ============================================
-- CACHE
-- ============================================

-- Response cache with reasonable TTLs
pc = newPacketCache(100000, {
    maxTTL = 3600,
    minTTL = 30,
    temporaryFailureTTL = 10,
    staleTTL = 86400,
    dontAge = false
})
getPool("unbound"):setCache(pc)

-- ============================================
-- RATE LIMITING
-- ============================================

-- Rate limit per source IP: 100 QPS with /24 IPv4 and /56 IPv6 aggregation
addAction(MaxQPSIPRule(100, 24, 56), SetRCodeAction(DNSRCode.REFUSED))

-- Rate limit per domain (slow queries - DDoS protection)
addAction(MaxQPSRule(1000), SetRCodeAction(DNSRCode.REFUSED))

-- ============================================
-- SECURITY
-- ============================================

-- Drop queries with suspicious characteristics
addAction(QTypeRule(DNSQType.ANY), RCodeAction(DNSRCode.REFUSED))
addAction(RDRule(), RCodeAction(DNSRCode.REFUSED)) -- Refuse non-recursive

-- ============================================
-- STARTUP
-- ============================================

infolog("Nebula DNS dnsdist started (Kubernetes production)")
infolog("DoT listening on port 853")
infolog("DoH listening on port 443 at /dns-query")
infolog("Policy service: " .. POLICY_SVC_URL)
