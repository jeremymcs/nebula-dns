# Nebula DNS - Unbound Configuration
# Copyright (c) 2024 Jeremy McSpadden <jeremy@fluxlabs.net>
# Recursive DNS resolver with DNSSEC validation

server:
    # Interface and port
    interface: 0.0.0.0
    port: 53
    
    # Access control
    access-control: 0.0.0.0/0 allow
    
    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-local-actions: no
    
    # Performance tuning
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4
    
    # Cache sizes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    key-cache-size: 32m
    neg-cache-size: 16m
    
    # DNSSEC validation (mandatory for Nebula DNS)
    auto-trust-anchor-file: "/etc/unbound/root.key"
    
    # Hardening
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    
    # Privacy
    qname-minimisation: yes
    aggressive-nsec: yes
    
    # Root hints
    root-hints: "/etc/unbound/root.hints"
    
    # Prefetch (improves latency for popular domains)
    prefetch: yes
    prefetch-key: yes
    
    # TCP settings
    incoming-num-tcp: 100
    outgoing-num-tcp: 100
    
    # Edns settings
    edns-buffer-size: 1232
    
    # Serve stale records
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800
    
    # Minimal responses
    minimal-responses: yes

# Remote control (disabled for security)
remote-control:
    control-enable: no
