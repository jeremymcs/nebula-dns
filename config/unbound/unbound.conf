server:
    verbosity: 1
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    cache-min-ttl: 3600
    cache-max-ttl: 86400
    prefetch: yes
    qname-minimisation: yes
    aggressive-nsec: yes

# Forward to public resolvers (configure as needed)
forward-zone:
    name: "."
    forward-addr: 1.1.1.1@53
    forward-addr: 8.8.8.8@53
