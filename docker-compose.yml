# Usage: docker compose up -d

services:
  # ============================================
  # CONTROL PLANE
  # ============================================

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: development
    container_name: dnsfilter-api
    ports:
      - "4010:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://nebula:nebula@postgres:5432/nebula
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DATABASE: nebula_dns
      CLICKHOUSE_USER: nebula
      CLICKHOUSE_PASSWORD: nebula
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:4011,http://localhost:4012,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - dnsfilter-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: development
    container_name: dnsfilter-ui
    ports:
      - "4011:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4010
    depends_on:
      - api
    volumes:
      - ./ui:/app
      - /app/node_modules
    networks:
      - dnsfilter-network

  # ============================================
  # DATA PLANE
  # ============================================

  dnsdist:
    build:
      context: ./config/dnsdist
      dockerfile: Dockerfile
    container_name: dnsfilter-dnsdist
    ports:
      - "4853:853/tcp"   # DoT
      - "4443:443/tcp"   # DoH
      - "4083:8083/tcp"  # Metrics (internal)
    depends_on:
      - policy-svc
      - unbound
      - redis
    volumes:
      - ./config/dnsdist/dnsdist.conf:/etc/dnsdist/dnsdist.conf:ro
      - ./config/certs:/etc/dnsdist/certs:ro
    networks:
      - dnsfilter-network
    cap_add:
      - NET_BIND_SERVICE

  policy-svc:
    build:
      context: ./policy-svc
      dockerfile: Dockerfile
    container_name: dnsfilter-policy-svc
    ports:
      - "4080:8080"
    environment:
      PORT: 8080
      REDIS_URL: redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: nebula_dns
      CLICKHOUSE_USER: nebula
      CLICKHOUSE_PASSWORD: nebula
      POSTGRES_URL: postgresql://nebula:nebula@postgres:5432/nebula
      LOG_LEVEL: debug
      FAIL_MODE: open
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - dnsfilter-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  unbound:
    build:
      context: ./config/unbound
      dockerfile: Dockerfile
    container_name: dnsfilter-unbound
    ports:
      - "5354:53/udp"
      - "5354:53/tcp"
    volumes:
      - ./config/unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      - dnsfilter-network
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "google.com"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # STORAGE
  # ============================================

  postgres:
    image: postgres:16-alpine
    container_name: dnsfilter-postgres
    ports:
      - "4432:5432"
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
      POSTGRES_DB: nebula
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dnsfilter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dnsfilter-redis
    ports:
      - "4379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - dnsfilter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: dnsfilter-clickhouse
    ports:
      - "4123:8123"  # HTTP
      - "4900:9000"  # Native
    environment:
      CLICKHOUSE_USER: nebula
      CLICKHOUSE_PASSWORD: nebula
      CLICKHOUSE_DB: nebula_dns
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dnsfilter-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # DEVELOPMENT TOOLS
  # ============================================

  # Adminer for PostgreSQL management
  adminer:
    image: adminer:latest
    container_name: dnsfilter-adminer
    ports:
      - "4081:8080"
    networks:
      - dnsfilter-network
    profiles:
      - dev-tools

  # RedisInsight for Redis management
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: dnsfilter-redis-insight
    ports:
      - "4082:8001"
    networks:
      - dnsfilter-network
    profiles:
      - dev-tools

networks:
  dnsfilter-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
