<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Unblock Requests Inbox</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb;padding:24px}
h1{color:#4B7CBB;font-size:22px}
table{width:100%;border-collapse:collapse;margin-top:16px;background:#111827;border-radius:12px;overflow:hidden}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #1f2937;font-size:14px}
th{background:#1E3B78;color:#fff}
.badge{background:#FF6E62;color:#fff;padding:2px 8px;border-radius:999px;font-size:12px}
.actions button{margin-right:8px;padding:6px 10px;border-radius:6px;border:0;font-weight:600}
.approve{background:#4B7CBB;color:#fff}.deny{background:#374151;color:#fff}
</style></head><body>
<h1>Unblock Requests</h1>
<table><thead><tr><th>Domain</th><th>Requester</th><th>Status</th><th>Actions</th></tr></thead>
<tbody><tr><td>social.example.com</td><td>alex@contoso.com</td><td><span class="badge">pending</span></td>
<td class="actions"><button class="approve">Approve</button><button class="deny">Deny</button></td></tr></tbody></table>
</body></html>
