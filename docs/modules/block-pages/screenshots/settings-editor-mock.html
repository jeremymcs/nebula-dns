<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Block Page Settings</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1220;color:#e5e7eb}
.wrap{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px}
label{display:block;font-size:12px;color:#9ca3af;margin:8px 0 4px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #374151;background:#0f172a;color:#fff}
.preview{background:#f3f4f6;border-radius:12px;padding:12px;color:#111}
h1{font-size:20px;color:#4B7CBB}
</style></head>
<body><div class="wrap"><div class="panel"><h1>Flux Shield — Block Page Editor</h1>
<label>Headline</label><input value="Access Blocked"/>
<label>Primary color</label><input value="#1E3B78"/>
<label>Message</label><textarea rows="3">This site has been blocked by your organization's security policy.</textarea>
<label><input type="checkbox" checked/> Show unblock request form</label></div>
<div class="panel preview"><strong>Live preview</strong><div style="margin-top:12px;padding:16px;background:linear-gradient(135deg,#1E3B78,#4B7CBB);color:#fff;border-radius:8px">Access Blocked</div>
<p style="margin-top:12px">blocked.example.com</p><button style="width:100%;padding:10px;background:#FF6E62;color:#fff;border:0;border-radius:8px">Request unblock</button></div></div></body></html>
