# Nebula DNS - Kubernetes Secrets Template
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
#
# This template documents all secrets required by Nebula DNS services.
# Use create-secrets.sh to generate from Terraform outputs,
# or apply this template with values filled in manually.
#
# WARNING: Do not commit this file with real values!

---
# API Secrets - Used by NestJS API service
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: nebula-dns
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # PostgreSQL via PgBouncer (for application queries)
  database-url: "postgresql://nebula:PASSWORD@HOST:PORT/nebula?sslmode=require"
  # PostgreSQL direct (for migrations - bypasses PgBouncer)
  database-direct-url: "postgresql://nebula:PASSWORD@DIRECT_HOST:PORT/nebula?sslmode=require"
  # Valkey/Redis (TLS)
  redis-url: "rediss://:PASSWORD@HOST:PORT"
  # JWT authentication
  jwt-secret: "RANDOM_BASE64_48"
  jwt-refresh-secret: "RANDOM_BASE64_48"
  admin-jwt-secret: "RANDOM_BASE64_48"
  # Encryption keys (32 bytes hex)
  mfa-encryption-key: "RANDOM_HEX_32"
  sso-encryption-key: "RANDOM_HEX_32"
  siem-encryption-key: "RANDOM_HEX_32"

---
# Policy Service Secrets - Used by Go Policy Service
apiVersion: v1
kind: Secret
metadata:
  name: policy-svc-secrets
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: nebula-dns
    app.kubernetes.io/component: policy-svc
type: Opaque
stringData:
  redis-url: "rediss://:PASSWORD@HOST:PORT"
  clickhouse-url: "https://HOST:8443"

---
# ClickHouse Secrets - Used by ClickHouse init job
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secrets
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: nebula-dns
    app.kubernetes.io/component: clickhouse
type: Opaque
stringData:
  username: "default"
  password: "CLICKHOUSE_PASSWORD"
  host: "CLICKHOUSE_HOST"
  port: "8443"
