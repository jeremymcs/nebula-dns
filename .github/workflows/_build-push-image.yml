#
# Reusable workflow for building and pushing Docker images to DigitalOcean Container Registry
# Called by deploy workflows to build API, UI, Admin UI, Policy Service, dnsdist, and Unbound images

name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      service:
        description: 'Service name for cache scoping (e.g., api, ui, admin-ui)'
        required: true
        type: string
      context:
        description: 'Docker build context path (e.g., ./api, ./ui)'
        required: true
        type: string
      registry:
        description: 'Container registry URL (e.g., registry.digitalocean.com/nebula-dns)'
        required: true
        type: string
      image_name:
        description: 'Full image name (e.g., nebula-dns-api)'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile (optional, defaults to Dockerfile in context)'
        required: false
        type: string
        default: ''
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        description: 'DigitalOcean API token for DOCR authentication'
        required: true

jobs:
  build-and-push:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile != '' && inputs.dockerfile || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}-build
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-build
          build-args: |
            BUILDKIT_INLINE_CACHE=1
