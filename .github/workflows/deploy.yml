# Nebula DNS - Droplet deployment workflow
# Builds data-plane images to GHCR and rolls the production droplet via SSH.
# UI and admin-ui deploy on Vercel — not built here.
#
# Required secrets: DROPLET_HOST, DROPLET_SSH_KEY
# Optional: DROPLET_USER (default root), DROPLET_DEPLOY_PATH (default /opt/nebula-dns/deploy/droplet)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DEPLOY_PATH: /opt/nebula-dns/deploy/droplet

jobs:
  build-api:
    uses: ./.github/workflows/_build-push-ghcr.yml
    with:
      service: api
      context: ./api
      image_name: nebula-dns-api

  build-policy-svc:
    uses: ./.github/workflows/_build-push-ghcr.yml
    with:
      service: policy-svc
      context: ./policy-svc
      image_name: nebula-dns-policy-svc

  build-dnsdist:
    uses: ./.github/workflows/_build-push-ghcr.yml
    with:
      service: dnsdist
      context: .
      dockerfile: deploy/droplet/dnsdist.Dockerfile
      image_name: nebula-dns-dnsdist

  build-unbound:
    uses: ./.github/workflows/_build-push-ghcr.yml
    with:
      service: unbound
      context: ./config/unbound
      image_name: nebula-dns-unbound

  deploy-droplet:
    name: Deploy droplet stack
    needs: [build-api, build-policy-svc, build-dnsdist, build-unbound]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out on droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DROPLET_DEPLOY_PATH || '/opt/nebula-dns/deploy/droplet' }}"
            cd "${DEPLOY_PATH}"
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      - name: Deployment summary
        run: |
          echo "## Droplet deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**API:** https://api.nebuladns.io/health" >> "$GITHUB_STEP_SUMMARY"
          echo "**App (Vercel):** https://app.nebuladns.io" >> "$GITHUB_STEP_SUMMARY"
