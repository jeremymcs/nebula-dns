#
# Continuous Integration Workflow

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.23'

jobs:
  # API Tests
  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nebula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Run linting
        working-directory: ./api
        run: npm run lint

      - name: Run unit tests
        working-directory: ./api
        run: npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nebula_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Run E2E tests
        working-directory: ./api
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nebula_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  # API Integration Tests (uses Testcontainers)
  api-integration-test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    
    services:
      docker:
        image: docker:24-cli
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Run integration tests
        working-directory: ./api
        run: npm run test:integration
        env:
          NODE_ENV: test
          # Testcontainers will start its own containers
          # No external services needed

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-results
          path: api/test-results/
          retention-days: 7

  # DNS E2E Tests (requires full Docker Compose stack)
  dns-e2e-test:
    name: DNS E2E Tests
    runs-on: ubuntu-latest
    needs: [api-test, api-integration-test, policy-svc-test, policy-integration-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Start Docker Compose services
        run: |
          docker compose up -d postgres redis clickhouse
          # Wait for services to be healthy
          sleep 30
          docker compose up -d policy-svc unbound dnsdist
          # Wait for DNS stack to be ready
          sleep 15

      - name: Run DNS E2E tests
        working-directory: ./api
        run: npm run test:e2e:dns
        env:
          NODE_ENV: test
          DOH_URL: https://localhost:4443/dns-query
          POLICY_SVC_URL: http://localhost:4080
          CLICKHOUSE_URL: http://localhost:4123
          API_URL: http://localhost:4010
          SKIP_DOCKER_TESTS: 'true'
        continue-on-error: true

      - name: Upload DNS E2E coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/dns-e2e/lcov.info
          flags: dns-e2e
          fail_ci_if_error: false

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  # UI Tests
  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci --legacy-peer-deps

      - name: Run linting
        working-directory: ./ui
        run: npm run lint

      - name: Type check
        working-directory: ./ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  # Policy Service Tests
  policy-svc-test:
    name: Policy Service Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      - name: Run tests
        working-directory: ./policy-svc
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          REDIS_URL: localhost:6379

      - name: Run benchmarks
        working-directory: ./policy-svc
        run: go test -bench=. -benchmem ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./policy-svc/coverage.out
          flags: policy-svc
          fail_ci_if_error: false

  # Policy Service Integration Tests
  policy-integration-test:
    name: Policy Service Integration Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      clickhouse:
        image: clickhouse/clickhouse-server:24.1
        ports:
          - 8123:8123
          - 9000:9000
        options: --ulimit nofile=262144:262144

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      - name: Run integration tests
        working-directory: ./policy-svc
        run: go test ./... -v -tags=integration
        env:
          TEST_REDIS_URL: redis://localhost:6379
          TEST_CLICKHOUSE_URL: http://localhost:8123
          TEST_CLICKHOUSE_DB: default

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-integration-results
          path: policy-svc/test-results/
          retention-days: 7

  # UI E2E Tests
  ui-e2e-test:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    needs: [ui-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ./ui
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./ui
        run: npx playwright test --project=chromium
        env:
          CI: true
          TEST_BASE_URL: http://localhost:4011

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: ui/test-results/
          retention-days: 7

  # Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [api-test, api-integration-test, ui-test, policy-svc-test, policy-integration-test, dns-e2e-test]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: nebula-dns-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: false
          tags: nebula-dns-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Policy Service image
        uses: docker/build-push-action@v5
        with:
          context: ./policy-svc
          push: false
          tags: nebula-dns-policy-svc:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [api-test, ui-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
