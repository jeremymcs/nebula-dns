#
# Continuous Integration Workflow

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: # Allow reuse from other workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.23'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.outputs.outputs.api }}
      policy-svc: ${{ steps.outputs.outputs.policy-svc }}
      ui: ${{ steps.outputs.outputs.ui }}
      admin-ui: ${{ steps.outputs.outputs.admin-ui }}
      agents: ${{ steps.outputs.outputs.agents }}
      mobile: ${{ steps.outputs.outputs.mobile }}
      ci: ${{ steps.outputs.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Path filter
        if: github.event_name != 'workflow_call'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            policy-svc:
              - 'policy-svc/**'
            ui:
              - 'ui/**'
              - 'shared/**'
            admin-ui:
              - 'admin-ui/**'
              - 'shared/**'
            agents:
              - 'agents/**'
            mobile:
              - 'apps/mobile/**'
            ci:
              - '.github/**'

      - name: Set change outputs
        id: outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "policy-svc=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "admin-ui=true" >> "$GITHUB_OUTPUT"
            echo "agents=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "policy-svc=${{ steps.filter.outputs.policy-svc }}" >> "$GITHUB_OUTPUT"
            echo "ui=${{ steps.filter.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "admin-ui=${{ steps.filter.outputs.admin-ui }}" >> "$GITHUB_OUTPUT"
            echo "agents=${{ steps.filter.outputs.agents }}" >> "$GITHUB_OUTPUT"
            echo "mobile=${{ steps.filter.outputs.mobile }}" >> "$GITHUB_OUTPUT"
            echo "ci=${{ steps.filter.outputs.ci }}" >> "$GITHUB_OUTPUT"
          fi

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.api == 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nebula_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Run database migrations
        working-directory: ./api
        run: npm run migration:run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nebula_test
          NODE_ENV: development

      - name: Verify entity schema matches migrations
        working-directory: ./api
        run: npm run schema:audit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nebula_test
          NODE_ENV: development

      - name: Run linting
        working-directory: ./api
        run: npm run lint

      - name: Run unit tests
        working-directory: ./api
        run: npm run test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nebula_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          ADMIN_JWT_SECRET: test-admin-jwt-secret
          NODE_ENV: test

      - name: Run E2E tests
        working-directory: ./api
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/nebula_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          ADMIN_JWT_SECRET: test-admin-jwt-secret
          DISABLE_RATE_LIMIT: 'true'
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./api/coverage/lcov.info
          flags: api
          fail_ci_if_error: false

  api-integration-test:
    name: API Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.api == 'true'

    services:
      docker:
        image: docker:24-cli
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Run integration tests
        working-directory: ./api
        run: npm run test:integration
        env:
          NODE_ENV: test

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-results
          path: api/test-results/
          retention-days: 7

  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.ui == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci --legacy-peer-deps

      - name: Run linting
        working-directory: ./ui
        run: npm run lint

      - name: Type check
        working-directory: ./ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  admin-ui-test:
    name: Admin UI Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.admin-ui == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./admin-ui
        run: npm ci --legacy-peer-deps

      - name: Run linting
        working-directory: ./admin-ui
        run: npm run lint

      - name: Type check
        working-directory: ./admin-ui
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./admin-ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  flux-shield-agent:
    name: Flux Shield Agent
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.agents == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/safedns-agent/go.sum
      - name: Test agent
        working-directory: ./agents/safedns-agent
        run: go test ./...
      - name: Build Windows binary
        working-directory: ./agents/safedns-agent
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=1.0.0" -o dist/fluxshield-agent.exe ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: fluxshield-agent-windows-amd64
          path: |
            agents/safedns-agent/dist/fluxshield-agent.exe
            agents/safedns-agent/scripts/install.ps1
            agents/safedns-agent/docs/INSTALL-WINDOWS.md

  flux-shield-agent-msi:
    name: Flux Shield Agent MSI (unsigned)
    runs-on: windows-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.agents == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/safedns-agent/go.sum
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y
      - name: Build MSI (sign on your Windows machine)
        working-directory: agents/safedns-agent
        shell: pwsh
        run: ./scripts/build-msi.ps1 -Version 1.0.0 -SkipSign
      - uses: actions/upload-artifact@v4
        with:
          name: fluxshield-agent-msi-unsigned
          path: |
            agents/safedns-agent/dist/*.msi
            agents/safedns-agent/dist/fluxshield-agent.exe
          if-no-files-found: error

  policy-svc-test:
    name: Policy Service Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.policy-svc == 'true'

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      - name: Run tests
        working-directory: ./policy-svc
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          REDIS_URL: localhost:6379

      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        working-directory: ./policy-svc
        run: go test -bench=. -benchmem ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./policy-svc/coverage.out
          flags: policy-svc
          fail_ci_if_error: false

  policy-integration-test:
    name: Policy Service Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.policy-svc == 'true'

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      clickhouse:
        image: clickhouse/clickhouse-server:24.1
        ports:
          - 8123:8123
          - 9000:9000
        options: --ulimit nofile=262144:262144

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      - name: Run integration tests
        working-directory: ./policy-svc
        run: go test ./... -v -tags=integration
        env:
          TEST_REDIS_URL: redis://localhost:6379
          TEST_CLICKHOUSE_URL: http://localhost:8123
          TEST_CLICKHOUSE_DB: default

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-integration-results
          path: policy-svc/test-results/
          retention-days: 7

  mobile-test:
    name: Mobile App
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.mobile == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/mobile
        run: npm ci

      - name: Type check
        working-directory: ./apps/mobile
        run: npm run typecheck

      - name: Lint
        working-directory: ./apps/mobile
        run: npm run lint

      - name: Unit tests
        working-directory: ./apps/mobile
        run: npm test -- --ci

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - api-test
      - api-integration-test
      - ui-test
      - admin-ui-test
      - flux-shield-agent
      - flux-shield-agent-msi
      - policy-svc-test
      - policy-integration-test
      - mobile-test
    if: always()

    steps:
      - name: Require passing jobs
        run: |
          check_result() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error title=CI Gate::$name finished with $result"
              exit 1
            fi
          }

          check_result "changes" "${{ needs.changes.result }}"
          check_result "api-test" "${{ needs.api-test.result }}"
          check_result "api-integration-test" "${{ needs.api-integration-test.result }}"
          check_result "ui-test" "${{ needs.ui-test.result }}"
          check_result "admin-ui-test" "${{ needs.admin-ui-test.result }}"
          check_result "flux-shield-agent" "${{ needs.flux-shield-agent.result }}"
          check_result "flux-shield-agent-msi" "${{ needs.flux-shield-agent-msi.result }}"
          check_result "policy-svc-test" "${{ needs.policy-svc-test.result }}"
          check_result "policy-integration-test" "${{ needs.policy-integration-test.result }}"
          check_result "mobile-test" "${{ needs.mobile-test.result }}"

          echo "CI Gate passed (skipped jobs are OK for path-filtered runs)."
