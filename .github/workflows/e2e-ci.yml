name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.outputs.outputs.ui }}
      ci: ${{ steps.outputs.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Path filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'ui/**'
              - 'shared/**'
              - 'shared/print-mfa-backup-codes.ts'
            ci:
              - '.github/**'

      - name: Set change outputs
        id: outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=${{ steps.filter.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "ci=${{ steps.filter.outputs.ci }}" >> "$GITHUB_OUTPUT"
          fi

  e2e-tests:
    name: E2E Tests (Chromium) shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name != 'pull_request' && (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.ui == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule'
      )
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ./ui
        run: npx playwright install --with-deps chromium

      - name: Run full E2E suite (excluding edge/security)
        working-directory: ./ui
        run: npx playwright test --project=chromium --workers=4 --reporter=html,line --shard=${{ matrix.shard }}/3
        env:
          CI: true
          TEST_BASE_URL: http://localhost:4011
          PLAYWRIGHT_USE_PROD_SERVER: '1'
          PLAYWRIGHT_FULL_SUITE: '1'

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: ui/playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: ui/test-results/
          retention-days: 7

  e2e-edge-tests:
    name: Edge Case E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' && (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.ui == 'true'
      )
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ./ui
        run: npx playwright install --with-deps chromium

      - name: Run edge case E2E tests
        working-directory: ./ui
        run: npx playwright test e2e/edge --project=chromium --workers=2 --reporter=html,line
        env:
          CI: true
          TEST_BASE_URL: http://localhost:4011
          PLAYWRIGHT_USE_PROD_SERVER: '1'

      - name: Upload edge test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-test-results
          path: ui/playwright-report/
          retention-days: 7

      - name: Calculate edge test flakiness
        if: always()
        working-directory: ./ui
        run: |
          chmod +x scripts/flakiness-report.sh
          bash scripts/flakiness-report.sh >> $GITHUB_STEP_SUMMARY
        env:
          FLAKY_THRESHOLD: 5

  security-e2e-tests:
    name: Security E2E Tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' && (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.ui == 'true'
      )
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: ./ui
        run: npx playwright install --with-deps chromium

      - name: Run security E2E tests
        working-directory: ./ui
        run: npx playwright test e2e/security --project=chromium --reporter=html,line
        env:
          CI: true
          TEST_BASE_URL: http://localhost:4011
          PLAYWRIGHT_USE_PROD_SERVER: '1'

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: ui/playwright-report/
          retention-days: 14

      - name: Calculate security test flakiness
        if: always()
        working-directory: ./ui
        run: |
          chmod +x scripts/flakiness-report.sh
          bash scripts/flakiness-report.sh >> $GITHUB_STEP_SUMMARY
        env:
          FLAKY_THRESHOLD: 5

  test-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    needs: [changes, e2e-tests, e2e-edge-tests, security-e2e-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# E2E Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Jobs Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full E2E (sharded) | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Case Tests | ${{ needs.e2e-edge-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: E2E gate
        run: |
          check_result() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error title=E2E Gate::$name finished with $result"
              exit 1
            fi
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.changes.outputs.ui }}" != "true" ] && [ "${{ needs.changes.outputs.ci }}" != "true" ]; then
              echo "No UI/E2E paths changed; E2E gate passed."
              exit 0
            fi
            check_result "e2e-edge-tests" "${{ needs.e2e-edge-tests.result }}"
            check_result "security-e2e-tests" "${{ needs.security-e2e-tests.result }}"
          else
            if [ "${{ needs.changes.outputs.ui }}" != "true" ] && [ "${{ needs.changes.outputs.ci }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ github.event_name }}" != "schedule" ]; then
              echo "No UI/E2E paths changed; E2E gate passed."
              exit 0
            fi
            check_result "e2e-tests" "${{ needs.e2e-tests.result }}"
          fi

          echo "E2E gate passed."
