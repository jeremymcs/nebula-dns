# Nebula DNS - Security Scanning Workflow
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
#
# Comprehensive security scanning including SAST, dependency scanning,
# container image scanning, secrets detection, and SBOM generation.

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:  # Allow manual triggers
  workflow_call:  # Allow reuse from deploy.yml

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.23'

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # CodeQL SAST Analysis
  codeql-analysis:
    name: CodeQL SAST Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript', 'go']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          output: sarif-results
        continue-on-error: true

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
        continue-on-error: true

  # Secrets Scanning
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif

  # Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for API/UI)
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Setup Go (for policy-svc)
        if: matrix.component == 'policy-svc'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      # NPM Audit for API
      - name: NPM Audit - API
        if: matrix.component == 'api'
        working-directory: ./api
        run: |
          npm audit --audit-level=moderate --json > npm-audit-api.json || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload NPM Audit Results - API
        if: matrix.component == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-api
          path: api/npm-audit-api.json

      # NPM Audit for UI
      - name: NPM Audit - UI
        if: matrix.component == 'ui'
        working-directory: ./ui
        run: |
          npm audit --audit-level=moderate --json > npm-audit-ui.json || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload NPM Audit Results - UI
        if: matrix.component == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-ui
          path: ui/npm-audit-ui.json

      # Go vulnerability check for Policy Service
      - name: Install govulncheck
        if: matrix.component == 'policy-svc'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        if: matrix.component == 'policy-svc'
        working-directory: ./policy-svc
        run: |
          govulncheck -json ./... > govulncheck-results.json || true
          govulncheck ./...
        continue-on-error: true

      - name: Upload govulncheck Results
        if: matrix.component == 'policy-svc'
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-results
          path: policy-svc/govulncheck-results.json

      # OSSI - Open Source Security Insights
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        if: matrix.component == 'api' || matrix.component == 'ui'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
          command: test
          file: ${{ matrix.component }}/package.json

      - name: Upload Snyk results to GitHub Security
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # Container Image Scanning
  container-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    if: github.event_name == 'push' || github.event_name == 'schedule'

    strategy:
      fail-fast: false
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: nebula-dns-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nebula-dns-${{ matrix.component }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results-${{ matrix.component }}.sarif'
          category: 'trivy-${{ matrix.component }}'

      - name: Run Trivy for Critical/High vulnerabilities only
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nebula-dns-${{ matrix.component }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        continue-on-error: true

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nebula-dns-${{ matrix.component }}:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results-${{ matrix.component }}.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy JSON results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ matrix.component }}
          path: 'trivy-results-${{ matrix.component }}.json'

  # SBOM Generation
  sbom-generation:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    needs: [container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: nebula-dns-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha

      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@v0
        with:
          image: nebula-dns-${{ matrix.component }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.component }}.spdx.json
          output-file: ./sbom-${{ matrix.component }}.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: ./sbom-${{ matrix.component }}.spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: ./sbom-${{ matrix.component }}.spdx.json
          fail-build: false
          severity-cutoff: high

  # Container Image Signing (Cosign)
  image-signing:
    name: Sign Container Images
    runs-on: ubuntu-latest
    needs: [container-scan, sbom-generation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nebula-dns-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nebula-dns-${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/nebula-dns-${{ matrix.component }}:${{ github.sha }}

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity=https://github.com/${{ github.repository }}/.github/workflows/security-scan.yml@refs/heads/main \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            ghcr.io/${{ github.repository_owner }}/nebula-dns-${{ matrix.component }}:${{ github.sha }}

  # Security Report Summary
  security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [codeql-analysis, secrets-scan, dependency-scan, container-scan]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./security-reports

      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL SAST | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Review findings in the [Security tab](https://github.com/${{ github.repository }}/security)" >> $GITHUB_STEP_SUMMARY
          echo "- Check [Code scanning alerts](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "- Download detailed reports from workflow artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Create GitHub Issue on Critical Findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Critical Security Findings - ${context.sha.substring(0, 7)}`,
              body: `## Critical Security Vulnerabilities Detected

              **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              **Commit:** ${context.sha}
              **Branch:** ${context.ref}
              **Triggered by:** ${context.actor}

              One or more security scans have detected critical vulnerabilities that require immediate attention.

              ### Action Required

              1. Review the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for detailed findings
              2. Check the [Security tab](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security) for all alerts
              3. Download scan artifacts for detailed analysis
              4. Remediate critical and high severity vulnerabilities
              5. Re-run security scans after fixes

              ### Scan Results

              - CodeQL SAST: ${{ needs.codeql-analysis.result }}
              - Secrets Detection: ${{ needs.secrets-scan.result }}
              - Dependency Scan: ${{ needs.dependency-scan.result }}
              - Container Scan: ${{ needs.container-scan.result }}

              This issue was automatically created by the security scanning workflow.`,
              labels: ['security', 'critical', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`);

  # License Compliance Check
  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for API/UI)
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install license checker (NPM)
        if: matrix.component == 'api' || matrix.component == 'ui'
        run: npm install -g license-checker

      - name: Check NPM licenses
        if: matrix.component == 'api' || matrix.component == 'ui'
        working-directory: ./${{ matrix.component }}
        run: |
          npm ci
          license-checker --json --out ../licenses-${{ matrix.component }}.json
          license-checker --summary

      - name: Setup Go (for policy-svc)
        if: matrix.component == 'policy-svc'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install go-licenses
        if: matrix.component == 'policy-svc'
        run: go install github.com/google/go-licenses@latest

      - name: Check Go licenses
        if: matrix.component == 'policy-svc'
        working-directory: ./policy-svc
        run: |
          go-licenses report ./... --template=licenses.tpl > ../licenses-policy-svc.txt || true
          go-licenses check ./... --disallowed_types=forbidden,restricted

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.component }}
          path: licenses-${{ matrix.component }}.*
