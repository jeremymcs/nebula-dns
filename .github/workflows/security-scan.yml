# Nebula DNS - Security Scanning Workflow
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
#
# Comprehensive security scanning including SAST, dependency scanning,
# container image scanning, secrets detection, and SBOM generation.

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.23'

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.outputs.outputs.api }}
      policy-svc: ${{ steps.outputs.outputs.policy-svc }}
      ui: ${{ steps.outputs.outputs.ui }}
      ci: ${{ steps.outputs.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Path filter
        if: github.event_name != 'workflow_call' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            policy-svc:
              - 'policy-svc/**'
            ui:
              - 'ui/**'
              - 'shared/**'
            ci:
              - '.github/**'

      - name: Set change outputs
        id: outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "policy-svc=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "policy-svc=${{ steps.filter.outputs.policy-svc }}" >> "$GITHUB_OUTPUT"
            echo "ui=${{ steps.filter.outputs.ui }}" >> "$GITHUB_OUTPUT"
            echo "ci=${{ steps.filter.outputs.ci }}" >> "$GITHUB_OUTPUT"
          fi

  codeql-javascript-typescript:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name != 'pull_request' || (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.ui == 'true'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  codeql-go:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name != 'pull_request' || (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.policy-svc == 'true' ||
        needs.changes.outputs.api == 'true'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'push'
        with:
          sarif_file: results.sarif

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.event_name == 'pull_request' && (
        needs.changes.outputs.ci == 'true' ||
        needs.changes.outputs.api == 'true' ||
        needs.changes.outputs.ui == 'true' ||
        needs.changes.outputs.policy-svc == 'true'
      )

    strategy:
      fail-fast: false
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for API/UI)
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Setup Go (for policy-svc)
        if: matrix.component == 'policy-svc'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      - name: NPM Audit - API
        if: matrix.component == 'api'
        working-directory: ./api
        run: |
          npm ci
          npm audit --audit-level=high
        continue-on-error: true

      - name: NPM Audit - UI
        if: matrix.component == 'ui'
        working-directory: ./ui
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high
        continue-on-error: true

      - name: Install govulncheck
        if: matrix.component == 'policy-svc'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        if: matrix.component == 'policy-svc'
        working-directory: ./policy-svc
        run: govulncheck ./...
        continue-on-error: true

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for API/UI)
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Setup Go (for policy-svc)
        if: matrix.component == 'policy-svc'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: policy-svc/go.sum

      - name: NPM Audit - API
        if: matrix.component == 'api'
        working-directory: ./api
        run: |
          npm audit --audit-level=moderate --json > npm-audit-api.json || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload NPM Audit Results - API
        if: matrix.component == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-api
          path: api/npm-audit-api.json

      - name: NPM Audit - UI
        if: matrix.component == 'ui'
        working-directory: ./ui
        run: |
          npm audit --audit-level=moderate --json > npm-audit-ui.json || true
          npm audit --audit-level=high
        continue-on-error: true

      - name: Upload NPM Audit Results - UI
        if: matrix.component == 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-ui
          path: ui/npm-audit-ui.json

      - name: Install govulncheck
        if: matrix.component == 'policy-svc'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        if: matrix.component == 'policy-svc'
        working-directory: ./policy-svc
        run: |
          govulncheck -json ./... > govulncheck-results.json || true
          govulncheck ./...
        continue-on-error: true

      - name: Upload govulncheck Results
        if: matrix.component == 'policy-svc'
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-results
          path: policy-svc/govulncheck-results.json

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        if: matrix.component == 'api' || matrix.component == 'ui'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif
          command: test
          file: ${{ matrix.component }}/package.json

      - name: Upload Snyk results to GitHub Security
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  container-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: nebula-dns-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nebula-dns-${{ matrix.component }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results-${{ matrix.component }}.sarif'
          category: 'trivy-${{ matrix.component }}'

      - name: Run Trivy for Critical/High vulnerabilities only
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nebula-dns-${{ matrix.component }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
        continue-on-error: true

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nebula-dns-${{ matrix.component }}:${{ github.sha }}'
          format: 'json'
          output: 'trivy-results-${{ matrix.component }}.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy JSON results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ matrix.component }}
          path: 'trivy-results-${{ matrix.component }}.json'

  sbom-generation:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    needs: [container-scan]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule'

    strategy:
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: nebula-dns-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha

      - name: Generate SBOM using Syft
        uses: anchore/sbom-action@v0
        with:
          image: nebula-dns-${{ matrix.component }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.component }}.spdx.json
          output-file: ./sbom-${{ matrix.component }}.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.component }}
          path: ./sbom-${{ matrix.component }}.spdx.json

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: ./sbom-${{ matrix.component }}.spdx.json
          fail-build: false
          severity-cutoff: high

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        component: [api, ui, policy-svc]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (for API/UI)
        if: matrix.component == 'api' || matrix.component == 'ui'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install license checker (NPM)
        if: matrix.component == 'api' || matrix.component == 'ui'
        run: npm install -g license-checker

      - name: Check NPM licenses
        if: matrix.component == 'api' || matrix.component == 'ui'
        working-directory: ./${{ matrix.component }}
        run: |
          npm ci
          license-checker --json --out ../licenses-${{ matrix.component }}.json
          license-checker --summary

      - name: Setup Go (for policy-svc)
        if: matrix.component == 'policy-svc'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install go-licenses
        if: matrix.component == 'policy-svc'
        run: go install github.com/google/go-licenses@latest

      - name: Check Go licenses
        if: matrix.component == 'policy-svc'
        working-directory: ./policy-svc
        run: |
          go-licenses report ./... --template=licenses.tpl > ../licenses-policy-svc.txt || true
          go-licenses check ./... --disallowed_types=forbidden,restricted

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.component }}
          path: licenses-${{ matrix.component }}.*

  security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs:
      - changes
      - codeql-javascript-typescript
      - codeql-go
      - secrets-scan
      - dependency-audit
      - dependency-scan
      - container-scan
      - license-scan
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Security Summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL JS/TS | ${{ needs.codeql-javascript-typescript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Go | ${{ needs.codeql-go.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit (PR) | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Scan | ${{ needs.license-scan.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Security gate
        run: |
          check_result() {
            local name="$1"
            local result="$2"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error title=Security Gate::$name finished with $result"
              exit 1
            fi
          }

          check_result "secrets-scan" "${{ needs.secrets-scan.result }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.changes.outputs.api }}" != "true" ] && [ "${{ needs.changes.outputs.ui }}" != "true" ] && [ "${{ needs.changes.outputs.policy-svc }}" != "true" ] && [ "${{ needs.changes.outputs.ci }}" != "true" ]; then
              echo "No product paths changed; security gate passed."
              exit 0
            fi
            check_result "codeql-javascript-typescript" "${{ needs.codeql-javascript-typescript.result }}"
            check_result "codeql-go" "${{ needs.codeql-go.result }}"
          else
            check_result "dependency-scan" "${{ needs.dependency-scan.result }}"
            check_result "container-scan" "${{ needs.container-scan.result }}"
            check_result "codeql-javascript-typescript" "${{ needs.codeql-javascript-typescript.result }}"
            check_result "codeql-go" "${{ needs.codeql-go.result }}"
          fi

          echo "Security gate passed."

      - name: Create GitHub Issue on Critical Findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Critical Security Findings - ${context.sha.substring(0, 7)}`,
              body: `Security gate failed on workflow run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'critical', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`);
