apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safedns.fullname" . }}-secrets
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ printf "postgresql://postgres:%s@%s-postgresql:5432/safedns" .Values.postgresql.auth.postgresPassword (include "safedns.fullname" .) | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis-master:6379" .Values.redis.auth.password (include "safedns.fullname" .) | quote }}
  clickhouse-url: {{ printf "http://%s-clickhouse:8123" (include "safedns.fullname" .) | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
  stripe-secret-key: {{ .Values.secrets.stripeSecretKey | quote }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | quote }}

