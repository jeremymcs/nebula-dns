{{- if .Values.secrets.create | default true }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.api.secrets.name | default "api-secrets" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database connections
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  database-direct-url: {{ .Values.secrets.databaseDirectUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}

  # ClickHouse
  clickhouse-url: {{ .Values.secrets.clickhouseUrl | quote }}
  {{- if .Values.secrets.clickhouseUser }}
  clickhouse-user: {{ .Values.secrets.clickhouseUser | quote }}
  {{- end }}
  {{- if .Values.secrets.clickhousePassword }}
  clickhouse-password: {{ .Values.secrets.clickhousePassword | quote }}
  {{- end }}

  # Auth & Security
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}

  # External Services (optional)
  {{- if .Values.secrets.stripeSecretKey }}
  stripe-secret-key: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  stripe-webhook-secret: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.sendgridApiKey }}
  sendgrid-api-key: {{ .Values.secrets.sendgridApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.sentryDsn }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | quote }}
  {{- end }}
{{- end }}
