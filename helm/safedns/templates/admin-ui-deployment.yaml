{{- if .Values.adminUi.enabled | default true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "safedns.admin-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
spec:
  replicas: {{ .Values.adminUi.replicaCount }}
  selector:
    matchLabels:
      {{- include "safedns.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "safedns.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: admin-ui
          image: "{{ .Values.adminUi.image.repository }}:{{ .Values.adminUi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.adminUi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # Runtime env vars (NOT NEXT_PUBLIC_)
            - name: API_URL
              value: {{ .Values.adminUi.env.API_URL | quote }}
            - name: TENANT_UI_URL
              value: {{ .Values.adminUi.env.TENANT_UI_URL | quote }}
            - name: APP_URL
              value: {{ .Values.adminUi.env.APP_URL | quote }}
            # Stripe publishable key (build-time, but safe to pass as env too)
            {{- if .Values.adminUi.env.STRIPE_PUBLISHABLE_KEY }}
            - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
              value: {{ .Values.adminUi.env.STRIPE_PUBLISHABLE_KEY | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.adminUi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Next.js standalone needs write access to .next
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "safedns.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: admin-ui
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "safedns.admin-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "safedns.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
{{- end }}
