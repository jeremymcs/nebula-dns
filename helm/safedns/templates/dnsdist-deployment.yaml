apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "safedns.dnsdist.fullname" . }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
    app.kubernetes.io/component: dnsdist
spec:
  replicas: {{ .Values.dnsdist.replicaCount }}
  selector:
    matchLabels:
      {{- include "safedns.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dnsdist
  template:
    metadata:
      labels:
        {{- include "safedns.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dnsdist
    spec:
      {{- if eq .Values.dnsdist.antiAffinity "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "safedns.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: dnsdist
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: dnsdist
          image: "{{ .Values.dnsdist.image.repository }}:{{ .Values.dnsdist.image.tag }}"
          imagePullPolicy: {{ .Values.dnsdist.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dot
              containerPort: 853
              protocol: TCP
            - name: doh
              containerPort: 443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dnsdist.resources | nindent 12 }}
          env:
            - name: POLICY_SVC_URL
              value: "http://{{ include "safedns.policy-svc.fullname" . }}:{{ .Values.policySvc.service.port }}"
          volumeMounts:
            - name: certs
              mountPath: /etc/dnsdist/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: {{ include "safedns.fullname" . }}-dnsdist-certs
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "safedns.dnsdist.fullname" . }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
    app.kubernetes.io/component: dnsdist
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: {{ .Values.dnsdist.service.type }}
  ports:
    - port: {{ .Values.dnsdist.service.dnsPort }}
      targetPort: dns-udp
      protocol: UDP
      name: dns-udp
    - port: {{ .Values.dnsdist.service.dnsPort }}
      targetPort: dns-tcp
      protocol: TCP
      name: dns-tcp
    - port: {{ .Values.dnsdist.service.dotPort }}
      targetPort: dot
      protocol: TCP
      name: dot
    - port: {{ .Values.dnsdist.service.dohPort }}
      targetPort: doh
      protocol: TCP
      name: doh
  selector:
    {{- include "safedns.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dnsdist

