{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "safedns.fullname" . }}-db-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: {{ .Values.migrations.hookWeight | default "-5" | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.migrations.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit | default 3 }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished | default 300 }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds | default 900 }}

  template:
    metadata:
      labels:
        {{- include "safedns.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db-migration
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never

      serviceAccountName: {{ include "safedns.fullname" . }}-db-migration

      imagePullSecrets:
        - name: registry-nebula-dns

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.migrations.initImage | default "busybox:1.36" }}
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z {{ .Values.postgresql.host | default "postgres" }} {{ .Values.postgresql.port | default 5432 }}; do
                echo "PostgreSQL is unavailable - sleeping"
                sleep 2
              done
              echo "PostgreSQL is up - proceeding with migrations"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: migration
          image: "{{ .Values.api.image.repository }}:latest"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          command:
            - 'npm'
            - 'run'
            - 'migration:run'

          env:
            - name: NODE_ENV
              value: {{ .Values.api.env.NODE_ENV | default "production" }}

            - name: LOG_LEVEL
              value: {{ .Values.migrations.logLevel | default "info" }}

            # Use direct PostgreSQL URI (not PgBouncer-pooled) for migrations.
            # PgBouncer transaction mode doesn't support DDL or advisory locks.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.secrets.name | default "api-secrets" }}
                  key: database-direct-url

            {{- with .Values.migrations.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.npm

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "safedns.fullname" . }}-db-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "safedns.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-migration
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "safedns.fullname" . }}-db-migration
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.api.secrets.name | default "api-secrets" }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "safedns.fullname" . }}-db-migration
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "safedns.fullname" . }}-db-migration
subjects:
  - kind: ServiceAccount
    name: {{ include "safedns.fullname" . }}-db-migration
    namespace: {{ .Release.Namespace }}
{{- end }}
