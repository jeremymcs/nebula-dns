# Nebula DNS Helm Chart Values

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# API Service
api:
  replicaCount: 2
  image:
    repository: nebuladns/api
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 4000
  secrets:
    name: api-secrets
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    FRONTEND_URL: "https://app.nebuladns.io"

# UI Service
ui:
  replicaCount: 2
  image:
    repository: nebuladns/ui
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 3000
  env:
    API_URL: "http://api.nebula-dns.svc.cluster.local:80"
    APP_URL: "https://app.nebuladns.io"
    ADMIN_UI_URL: "https://admin.nebuladns.io"
    MARKETING_DOMAIN: "nebuladns.io"
    APP_DOMAIN: "app.nebuladns.io"

# Admin UI Service
adminUi:
  replicaCount: 2
  image:
    repository: nebuladns/admin-ui
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 3000
  env:
    API_URL: "http://api.nebula-dns.svc.cluster.local:80"
    APP_URL: "https://app.nebuladns.io"
    TENANT_UI_URL: "https://app.nebuladns.io"

# Policy Service (Go)
policySvc:
  replicaCount: 3
  image:
    repository: nebuladns/policy-svc
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 8080
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60

# dnsdist DNS Proxy
dnsdist:
  replicaCount: 3
  image:
    repository: nebuladns/dnsdist
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 256Mi
  service:
    type: LoadBalancer
    dnsPort: 53
    dotPort: 853
    dohPort: 443
  antiAffinity: hard

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: ui
    - host: www.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: ui
    - host: app.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: ui
    - host: api.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: admin.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: admin-ui
  tls:
    - secretName: nebula-dns-tls
      hosts:
        - nebuladns.io
        - www.nebuladns.io
        - app.nebuladns.io
        - api.nebuladns.io
        - admin.nebuladns.io

# DNS endpoints (LoadBalancer services for DoT/DoH)
dnsEndpoints:
  dns1:
    hostname: dns1.nebuladns.io
    enabled: true
  dns2:
    hostname: dns2.nebuladns.io
    enabled: true

# Database configuration
postgresql:
  enabled: true
  host: postgres
  port: 5432
  auth:
    postgresPassword: ""
    database: nebuladns
  primary:
    persistence:
      size: 50Gi

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  architecture: replication
  replica:
    replicaCount: 2

# ClickHouse configuration
clickhouse:
  enabled: true
  host: clickhouse
  port: 8123
  database: nebula_dns
  secretName: clickhouse-secrets
  retentionDays: 90
  cloud: false  # Set to true for ClickHouse Cloud (changes protocol to https)
  protocol: http  # Use https for ClickHouse Cloud
  persistence:
    size: 100Gi

# Secrets (use external-secrets in production)
secrets:
  create: true
  databaseUrl: ""
  databaseDirectUrl: ""
  redisUrl: ""
  clickhouseUrl: ""
  clickhouseUser: ""
  clickhousePassword: ""
  jwtSecret: ""
  encryptionKey: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  sendgridApiKey: ""
  sentryDsn: ""

# Service Monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s

# Database Migrations
# NOTE: Migration job uses 'database-direct-url' from api-secrets (not 'database-url').
# This bypasses PgBouncer connection pooling, which is required for TypeORM migrations
# that use DDL statements and advisory locks.
migrations:
  enabled: true
  hookWeight: "-5"
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 900  # 15 minutes for production migrations with SSL/managed PostgreSQL
  logLevel: info
  initImage: busybox:1.36
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  annotations: {}
  extraEnv: []

