# Nebula DNS - Staging Helm Values for DOKS Deployment
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
#
# Usage: helm upgrade --install nebula-dns ./helm/safedns \
#   -f helm/safedns/values-staging.yaml \
#   -n nebula-dns-staging --wait
#
# Key differences from production:
# - Single replicas for cost savings (no HA needed in staging)
# - Lower resource requests/limits (smaller workloads)
# - Staging hostnames (*-staging.nebuladns.io)
# - NODE_ENV=staging for environment-specific behavior

# API Service - Staging
api:
  replicaCount: 1  # Production: 2+ with autoscaling
  image:
    repository: registry.digitalocean.com/nebula-dns/api
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m      # Production: 1000m
      memory: 512Mi  # Production: 1Gi
    requests:
      cpu: 100m      # Production: 250m
      memory: 256Mi  # Production: 256Mi
  env:
    NODE_ENV: staging  # Production: production
    LOG_LEVEL: debug   # More verbose logging for staging
    FRONTEND_URL: "https://app-staging.nebuladns.io"
  autoscaling:
    enabled: false  # Disabled in staging, fixed single replica

# UI Service - Staging
ui:
  replicaCount: 1  # Production: 2+
  image:
    repository: registry.digitalocean.com/nebula-dns/ui
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m      # Production: 500m
      memory: 256Mi  # Production: 512Mi
    requests:
      cpu: 50m       # Production: 100m
      memory: 128Mi  # Production: 128Mi
  env:
    API_URL: "http://nebula-dns-safedns-api.nebula-dns-staging.svc.cluster.local:80"
    APP_URL: "https://app-staging.nebuladns.io"
    ADMIN_UI_URL: "https://admin-staging.nebuladns.io"

# Admin UI Service - Staging
adminUi:
  enabled: true
  replicaCount: 1  # Production: 2+
  image:
    repository: registry.digitalocean.com/nebula-dns/admin-ui
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m      # Production: 500m
      memory: 256Mi  # Production: 512Mi
    requests:
      cpu: 50m       # Production: 100m
      memory: 128Mi  # Production: 128Mi
  env:
    API_URL: "http://nebula-dns-safedns-api.nebula-dns-staging.svc.cluster.local:80"
    APP_URL: "https://app-staging.nebuladns.io"
    TENANT_UI_URL: "https://app-staging.nebuladns.io"

# Policy Service (Go) - Staging
# Note: May be deployed via k8s/base instead of Helm chart
policySvc:
  replicaCount: 1  # Production: 3+ with autoscaling
  image:
    repository: registry.digitalocean.com/nebula-dns/policy-svc
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m      # Production: 500m
      memory: 128Mi  # Production: 256Mi
    requests:
      cpu: 50m       # Production: 100m
      memory: 64Mi   # Production: 64Mi
  autoscaling:
    enabled: false  # Disabled in staging

# dnsdist DNS Proxy - Staging
# Note: May be deployed via k8s/base instead of Helm chart
dnsdist:
  replicaCount: 1  # Production: 2+ for HA
  image:
    repository: registry.digitalocean.com/nebula-dns/dnsdist
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m      # Production: 2000m
      memory: 256Mi  # Production: 1Gi
    requests:
      cpu: 100m      # Production: 500m
      memory: 128Mi  # Production: 256Mi

# Unbound DNS Resolver - Staging
# Note: May be deployed via k8s/base instead of Helm chart
unbound:
  replicaCount: 1  # Production: 3 for redundancy
  image:
    repository: registry.digitalocean.com/nebula-dns/unbound
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Ingress - Staging
ingress:
  enabled: true
  className: nginx
  clusterIssuer: letsencrypt-staging  # Use Let's Encrypt staging to avoid rate limits
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: app-staging.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: ui
    - host: api-staging.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: admin-staging.nebuladns.io
      paths:
        - path: /
          pathType: Prefix
          service: admin-ui
  tls:
    - secretName: nebula-dns-staging-tls
      hosts:
        - app-staging.nebuladns.io
        - api-staging.nebuladns.io
        - admin-staging.nebuladns.io

# Database connections - managed by DigitalOcean
# Secrets are created via scripts/k8s/create-secrets.sh, NOT via Helm
secrets:
  create: false  # Secrets pre-provisioned by Phase 24-04 scripts

# Managed PostgreSQL via DigitalOcean (staging database)
postgresql:
  enabled: false  # Using managed DO PostgreSQL, not Helm-installed
  host: "private-nebula-dns-staging-pg-do-user-xxxxx.db.ondigitalocean.com"
  port: 25060

# Managed Valkey via DigitalOcean (staging instance)
redis:
  enabled: false  # Using managed DO Valkey, not Helm-installed

# ClickHouse Cloud (staging environment)
clickhouse:
  enabled: false  # Using ClickHouse Cloud, not Helm-installed
  cloud: true
  protocol: https
  database: nebula_dns_staging

# Database Migrations - same timeout as production
migrations:
  enabled: true
  activeDeadlineSeconds: 900

# Service Monitor - disabled in staging by default
serviceMonitor:
  enabled: false  # Enable if Prometheus is deployed in staging
