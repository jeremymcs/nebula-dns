apiVersion: v2
name: safedns
description: SafeDNS - Enterprise DNS Security Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - dns
  - security
  - filtering
  - enterprise
maintainers:
  - name: SafeDNS Team
    email: support@safedns.io
home: https://safedns.io
sources:
  - https://github.com/safedns/dns-filter
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: clickhouse
    version: "4.x.x"
    repository: https://charts.altinity.com
    condition: clickhouse.enabled

