apiVersion: v2
name: nebuladns
description: Nebula DNS - Enterprise DNS Security Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - dns
  - security
  - filtering
  - enterprise
maintainers:
  - name: Nebula DNS Team
    email: support@nebuladns.io
home: https://nebuladns.io
sources:
  - https://github.com/fluxlabs/dns-filter
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: clickhouse
    version: "4.x.x"
    repository: https://charts.altinity.com
    condition: clickhouse.enabled

