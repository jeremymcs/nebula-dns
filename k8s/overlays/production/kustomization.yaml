apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nebula-dns

resources:
  - ../../base

# Production-specific patches
patches:
  # Increase replicas for production
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: policy-svc
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: dnsdist
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

# Update HPA for production traffic
  - target:
      kind: HorizontalPodAutoscaler
      name: policy-svc
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 50

images:
  - name: ghcr.io/nebuladns/api
    newTag: v1.0.0
  - name: ghcr.io/nebuladns/policy-svc
    newTag: v1.0.0
  - name: ghcr.io/nebuladns/dnsdist
    newTag: v1.0.0
  - name: ghcr.io/nebuladns/ui
    newTag: v1.0.0

configMapGenerator:
  - name: api-config
    literals:
      - frontend-url=https://app.nebuladns.io
