# Nebula DNS - External Secrets Definitions
# These sync secrets from your vault to Kubernetes

---
# API Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: nebula-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: nebula-dns/production/database
        property: url
    - secretKey: redis-url
      remoteRef:
        key: nebula-dns/production/redis
        property: url
    - secretKey: jwt-secret
      remoteRef:
        key: nebula-dns/production/jwt
        property: secret
    - secretKey: sendgrid-api-key
      remoteRef:
        key: nebula-dns/production/sendgrid
        property: api-key
    - secretKey: stripe-secret-key
      remoteRef:
        key: nebula-dns/production/stripe
        property: secret-key
    - secretKey: stripe-webhook-secret
      remoteRef:
        key: nebula-dns/production/stripe
        property: webhook-secret
    - secretKey: sentry-dsn
      remoteRef:
        key: nebula-dns/production/sentry
        property: dsn

---
# Policy Service Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: policy-svc-secrets
