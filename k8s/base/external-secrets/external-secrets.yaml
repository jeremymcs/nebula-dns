spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: policy-svc-secrets
    creationPolicy: Owner
  data:
    - secretKey: redis-url
      remoteRef:
        key: nebula-dns/production/redis
        property: url
    - secretKey: clickhouse-url
      remoteRef:
        key: nebula-dns/production/clickhouse
        property: url

---
# dnsdist Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dnsdist-secrets
  namespace: nebula-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dnsdist-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: nebula-dns/production/dnsdist
        property: api-key
