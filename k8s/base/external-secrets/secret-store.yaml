# Nebula DNS - External Secrets Configuration
# Prerequisites: Install External Secrets Operator
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace

---
# AWS Secrets Manager SecretStore
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # Change to your region
      auth:
        # Option 1: Use IAM role for service account (recommended)
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
        # Option 2: Use static credentials (not recommended for production)
        # secretRef:
        #   accessKeyIDSecretRef:
        #     name: aws-credentials
        #     key: access-key-id
        #   secretAccessKeySecretRef:
        #     name: aws-credentials
        #     key: secret-access-key

