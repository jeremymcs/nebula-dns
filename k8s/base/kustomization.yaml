apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nebula-dns

resources:
  - namespace.yaml
  - jobs/
  - api-deployment.yaml
  - policy-svc-deployment.yaml
  - dnsdist-configmap.yaml
  - dnsdist-deployment.yaml
  - unbound-statefulset.yaml
  - ui-deployment.yaml
  - admin-ui-deployment.yaml
  - ingress.yaml
  - pdbs/
  - network-policies/
  - cert-manager/
  - external-dns-deployment.yaml
  # Optional: Enable these as needed
  # - external-secrets/
  # - backups/
  # - monitoring/

commonLabels:
  app.kubernetes.io/part-of: nebula-dns
  app.kubernetes.io/managed-by: kustomize
