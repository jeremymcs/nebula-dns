# Nebula DNS - TLS Certificates
# These certificates are automatically provisioned by cert-manager
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>

---
# API, UI, and Admin UI certificate (via Ingress)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nebula-dns-web-tls
  namespace: nebula-dns
spec:
  secretName: nebula-dns-web-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: app.nebuladns.io
  dnsNames:
    - app.nebuladns.io
    - api.nebuladns.io
    - admin.nebuladns.io
  privateKey:
    algorithm: ECDSA
    size: 256

---
# DNS resolver certificate (DoT/DoH)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nebula-dns-resolver-tls
  namespace: nebula-dns
spec:
  secretName: dnsdist-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: dns1.nebuladns.io
  dnsNames:
    - dns1.nebuladns.io
    - dns2.nebuladns.io
    - dot.nebuladns.io
  privateKey:
    algorithm: ECDSA
    size: 256
  # Renew 30 days before expiry
  renewBefore: 720h
