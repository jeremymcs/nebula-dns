# Nebula DNS - Let's Encrypt Cluster Issuers
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
#
# Uses Cloudflare DNS-01 solver for certificate validation.
# Prerequisites:
#   1. cert-manager installed (via infrastructure/kubernetes/operators/install-operators.sh)
#   2. Cloudflare API token stored in cert-manager namespace:
#      kubectl -n cert-manager create secret generic cloudflare-api-token \
#        --from-literal=api-token='<token>'

---
# Staging issuer for testing (high rate limits, untrusted certs)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: jeremy@fluxlabs.net
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

---
# Production issuer (strict rate limits, trusted certs)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: jeremy@fluxlabs.net
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
