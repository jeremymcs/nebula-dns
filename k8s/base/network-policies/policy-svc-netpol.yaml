apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-svc-netpol
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: policy-svc
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: policy-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from dnsdist (DNS policy evaluation)
    - from:
        - podSelector:
            matchLabels:
              app: dnsdist
      ports:
        - port: 8080
          protocol: TCP
    # Allow ingress from API (cache management, health checks)
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow egress to Redis (policy cache, pub/sub)
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    # Allow egress to ClickHouse (query logging)
    - to:
        - podSelector:
            matchLabels:
              app: clickhouse
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    # Allow egress to Unbound (DNS resolution)
    - to:
        - podSelector:
            matchLabels:
              app: unbound
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow DNS resolution (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
