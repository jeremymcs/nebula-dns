apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-netpol
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from API (session cache, rate limiting)
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 6379
          protocol: TCP
    # Allow ingress from Policy Service (policy cache, pub/sub)
    - from:
        - podSelector:
            matchLabels:
              app: policy-svc
      ports:
        - port: 6379
          protocol: TCP
    # Allow ingress from Report Service (if deployed)
    - from:
        - podSelector:
            matchLabels:
              app: report-svc
      ports:
        - port: 6379
          protocol: TCP
  egress:
    # Allow DNS resolution (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
