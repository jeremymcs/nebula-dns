# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-netpol
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress-nginx controller only
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # Allow DNS resolution (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # UI is server-side rendered and needs no direct egress to other services
    # All API calls go through the browser to api.nebuladns.io
