apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - blackbox-exporter.yaml
  - prometheus-rules.yaml
  - servicemonitors.yaml

configMapGenerator:
  - name: grafana-dashboard-nebula-dns
    files:
      - grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
