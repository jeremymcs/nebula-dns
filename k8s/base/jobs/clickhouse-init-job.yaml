# Nebula DNS - ClickHouse Initialization Job
# Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
#
# This Job initializes ClickHouse schema for DNS query logging.
# It creates tables, indexes, and materialized views required for
# high-performance analytics.

apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  namespace: nebula-dns
  labels:
    app: clickhouse-init
    app.kubernetes.io/name: clickhouse-init
    app.kubernetes.io/component: database
  annotations:
    # Run before PostgreSQL migrations
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app: clickhouse-init
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never

      serviceAccountName: clickhouse-init

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Wait for ClickHouse to be ready
      initContainers:
        - name: wait-for-clickhouse
          image: curlimages/curl:8.5.0
          command:
            - 'sh'
            - '-c'
            - |
              echo "Waiting for ClickHouse to be ready..."
              until curl -sf "http://clickhouse:8123/ping"; do
                echo "ClickHouse is unavailable - sleeping"
                sleep 2
              done
              echo "ClickHouse is up - proceeding with initialization"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      containers:
        - name: init-schema
          image: curlimages/curl:8.5.0
          command:
            - 'sh'
            - '-c'
            - |
              set -e
              echo "Initializing ClickHouse schema..."

              # Execute initialization SQL
              curl -X POST "http://clickhouse:8123" \
                --data-binary @/scripts/init-clickhouse.sql \
                -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}"

              echo "ClickHouse schema initialized successfully"

              # Verify tables exist
              echo "Verifying tables..."
              TABLES=$(curl -s "http://clickhouse:8123/?query=SHOW+TABLES+FROM+nebula_dns" \
                -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}")

              echo "Created tables:"
              echo "$TABLES"

              if echo "$TABLES" | grep -q "query_logs"; then
                echo "✓ query_logs table created"
              else
                echo "✗ query_logs table missing"
                exit 1
              fi

          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secrets
                  key: username
                  optional: true

            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secrets
                  key: password
                  optional: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: init-scripts
              mountPath: /scripts
              readOnly: true

      volumes:
        - name: init-scripts
          configMap:
            name: clickhouse-init-scripts
---
# Service Account for ClickHouse init job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-init
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: clickhouse-init
---
# ConfigMap with initialization scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init-scripts
  namespace: nebula-dns
  labels:
    app.kubernetes.io/name: clickhouse-init
data:
  init-clickhouse.sql: |
    -- Nebula DNS ClickHouse Initialization Script
    -- Copyright (c) 2026 Jeremy McSpadden <jeremy@fluxlabs.net>
    -- This script creates the schema for DNS query logging

    -- Create database
    CREATE DATABASE IF NOT EXISTS nebula_dns;

    -- ============================================
    -- DNS QUERY LOG TABLE
    -- ============================================

    CREATE TABLE IF NOT EXISTS nebula_dns.query_logs
    (
        timestamp DateTime64(3),
        tenant_id UUID,
        location_id UUID,
        location_name String,
        domain String,
        query_type String,
        client_ip String,
        action Enum8('allow' = 1, 'block' = 2, 'rewrite' = 3),
        reason String,
        category Nullable(String),
        response_time_ms UInt32,
        cached UInt8,
        threat_type Nullable(String),
        policy_id Nullable(UUID)
    ) ENGINE = MergeTree()
    PARTITION BY toYYYYMMDD(timestamp)
    ORDER BY (tenant_id, timestamp)
    TTL toDateTime(timestamp) + INTERVAL 90 DAY
    SETTINGS index_granularity = 8192;

    -- Create bloom filter index for domain search
    ALTER TABLE nebula_dns.query_logs ADD INDEX IF NOT EXISTS idx_domain domain TYPE bloom_filter(0.01) GRANULARITY 1;

    -- Create set index for categories
    ALTER TABLE nebula_dns.query_logs ADD INDEX IF NOT EXISTS idx_category category TYPE set(100) GRANULARITY 1;

    -- ============================================
    -- MATERIALIZED VIEWS FOR REPORTING
    -- ============================================

    -- Hourly aggregation
    CREATE TABLE IF NOT EXISTS nebula_dns.hourly_stats (
        hour DateTime,
        tenant_id UUID,
        location_id UUID,
        total_queries UInt64,
        blocked_queries UInt64,
        allowed_queries UInt64,
        threat_blocks UInt64,
        avg_response_time Float64,
        cached_queries UInt64
    ) ENGINE = SummingMergeTree()
    PARTITION BY toYYYYMM(hour)
    ORDER BY (tenant_id, hour, location_id);

    -- Category statistics
    CREATE TABLE IF NOT EXISTS nebula_dns.category_stats (
        date Date,
        tenant_id UUID,
        category String,
        count UInt64
    ) ENGINE = SummingMergeTree()
    PARTITION BY toYYYYMM(date)
    ORDER BY (tenant_id, date, category);

    -- Domain statistics
    CREATE TABLE IF NOT EXISTS nebula_dns.domain_stats (
        date Date,
        tenant_id UUID,
        domain String,
        action Enum8('allow' = 1, 'block' = 2, 'rewrite' = 3),
        category String,
        count UInt64
    ) ENGINE = SummingMergeTree()
    PARTITION BY toYYYYMM(date)
    ORDER BY (tenant_id, date, action, domain);
