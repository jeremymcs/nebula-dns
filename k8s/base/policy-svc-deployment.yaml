apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-svc
  namespace: nebula-dns
  labels:
    app: policy-svc
    app.kubernetes.io/name: policy-svc
    app.kubernetes.io/component: dns-policy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: policy-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: policy-svc
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: policy-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: policy-svc
          image: ghcr.io/nebuladns/policy-svc:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: policy-svc-secrets
                  key: redis-url
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: policy-svc-secrets
                  key: clickhouse-url
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                secretKeyRef:
                  name: policy-svc-secrets
                  key: clickhouse-database
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: policy-svc-secrets
                  key: clickhouse-user
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: policy-svc-secrets
                  key: clickhouse-password
            - name: LOG_LEVEL
              value: "info"
            - name: FAIL_CLOSED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: policy-svc
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: policy-svc
  namespace: nebula-dns
  labels:
    app: policy-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: policy-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-svc
  namespace: nebula-dns
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policy-svc
  namespace: nebula-dns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policy-svc
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # Primary metric: DNS queries per second (custom metric from Prometheus Adapter)
    # Target: 1000 QPS per pod average
    # This correlates better with actual workload than CPU, since in-memory cache
    # lookups can handle high QPS at low CPU utilization
    - type: Pods
      pods:
        metric:
          name: dns_queries_per_second
        target:
          type: AverageValue
          averageValue: "1000"
    # Secondary metric: CPU utilization (fallback when custom metrics unavailable)
    # Target: 70% CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  # Anti-flapping behavior configuration
  # Prevents rapid pod churn during traffic fluctuations
  behavior:
    scaleDown:
      # Wait 5 minutes before scaling down to prevent flapping
      stabilizationWindowSeconds: 300
      policies:
        # Remove at most 1 pod per minute when scaling down
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # Wait 1 minute before scaling up
      stabilizationWindowSeconds: 60
      policies:
        # Increase by at most 50% of current pods per minute when scaling up
        - type: Percent
          value: 50
          periodSeconds: 60
